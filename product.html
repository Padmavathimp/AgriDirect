

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - AgriDirect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🌱 AgriDirect</h1>
    <nav>
        <a href="farmer.html">Dashboard</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="my-products.html">My Products</a>
        <a href="farmer-orders.html">Customer Orders</a>
    </nav>
</header>

<section class="container">
    <h2>🌾 Add New Product</h2>
    <p>Sell your fresh agricultural products directly to buyers.</p>

    <form id="productForm">

        <label>Crop Name</label>
        <input type="text" id="cropName"
            placeholder="Enter crop name" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Grains">Grains</option>
            <option value="Pulses">Pulses</option>
            <option value="Other">Other</option>
        </select>

        <label>Price per Kg (₹)</label>
        <input type="number" id="price"
            placeholder="Enter price" min="1" required>

        <label>Available Quantity (Kg)</label>
        <input type="number" id="quantity"
            placeholder="Enter quantity" min="1" required>

        <label>Product Image</label>
        <input type="file" id="productImage"
            accept="image/*" required>

        <label>Description</label>
        <textarea id="description"
            placeholder="Enter product description" required></textarea>

        <button type="submit">Add Product</button>

    </form>
</section>

<script src="js/product.js"></script>

</body>
</html>
