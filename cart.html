
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - AgriDirect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🌱 AgriDirect</h1>
    <nav>
        <a href="buyer.html">Dashboard</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="orders.html">My Orders</a>
        <a href="profile.html">My Profile</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<section class="container">
    <h2>🛒 My Shopping Cart</h2>

    <div id="cartItems">Loading cart...</div>

    <h3>Total Amount: ₹<span id="totalPrice">0</span></h3>

    <hr>

    <h2>Delivery Details</h2>

    <form id="checkoutForm">
        <input type="text" id="deliveryName"
            placeholder="Customer Name" required>

        <input type="tel" id="deliveryPhone"
            placeholder="Mobile Number"
            maxlength="10" required>

        <textarea id="deliveryAddress"
            placeholder="Delivery Address" required></textarea>

        <input type="text" id="deliveryPincode"
            placeholder="PIN Code"
            maxlength="6" required>

        <h3>Payment Method</h3>

        <label>
            <input type="radio" name="paymentMethod"
                value="Cash on Delivery" checked>
            Cash on Delivery
        </label>

        <br><br>

        <button type="submit">Place Order</button>
    </form>
</section>

<script src="js/cart.js"></script>

</body>
</html>
